[project]
name = "craftbench"
version = "0.1.0"
description = "RL environment that rewards well-crafted code, measured by what it costs to change"
requires-python = ">=3.11"
dependencies = ["pytest>=8"]

[project.scripts]
craftbench = "craftbench.cli:main"

[tool.setuptools.packages.find]
include = ["craftbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
